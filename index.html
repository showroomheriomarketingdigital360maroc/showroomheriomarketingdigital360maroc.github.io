<!DOCTYPE html>
<!--
  HERIO MARKETING DIGITAL 360 — Portafolio (HTML5, un solo archivo)
  Editar: teléfono, dirección y horarios en "const CFG" y "const HOURS"; platos y precios en "const MENU";
  reseñas reales en "const REVIEWS"; enlace de Google en "const GOOGLE_REVIEWS".

<html lang="ar" dir="rtl">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Cairo:wght@400;600;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== ESTILOS: colores en :root, secciones más abajo ===== */
:root{--bg:#050505;--panel:#111008;--line:#3a2f12;--gold:#e9b949;--gold2:#fff1b8;--gold3:#a87b1c;--txt:#f3ece0;--mut:#b5ab98;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0;line-height:1.15}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 45%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(5,5,5,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;max-width:1100px;margin:0 auto}
.logo{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;letter-spacing:.5px}
nav{display:flex;gap:16px;font-size:14px}
nav a{color:var(--mut);text-decoration:none}nav a:hover{color:var(--gold)}
.lang{display:flex;border:1px solid var(--gold3);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mut);padding:6px 11px;font:600 12px Montserrat,sans-serif;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold);color:#111}
.btn{display:inline-block;border:0;cursor:pointer;font:600 15px Montserrat,sans-serif;color:#1a1204;background:linear-gradient(135deg,var(--gold2),var(--gold) 50%,var(--gold3));padding:14px 28px;border-radius:99px;text-decoration:none;box-shadow:0 8px 30px rgba(233,185,73,.25)}
.btn.sm{padding:9px 18px;font-size:13px}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold3);box-shadow:none}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
html[lang=ar] *{font-family:Cairo,system-ui,sans-serif!important;letter-spacing:0!important}
input[type=tel],input[type=email]{direction:ltr;text-align:start}
.mh{color:var(--mut);margin:-18px 0 24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{background:none;border:1px solid var(--line);color:var(--mut);padding:9px 16px;border-radius:99px;font:600 14px Montserrat,sans-serif;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--gold);color:#111;border-color:var(--gold)}
#mp{list-style:none;margin:0;padding:14px 22px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
#mp li{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid #1d1a10}
#mp li:last-child{border:0}

#mp b{color:var(--gold);white-space:nowrap}
#mp small{display:block;color:var(--mut);font-size:12px}
.hrs{max-width:560px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:22px}
.hst{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hst i{width:12px;height:12px;border-radius:50%;background:#e5534b}
.hst.o i{background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.2)}
.hst b{font-size:18px}.hst span{color:var(--mut);font-size:14px}
#hl{list-style:none;margin:0;padding:0}
#hl li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1d1a10;color:var(--mut)}
#hl li.td{color:var(--gold);font-weight:600}
.note{color:var(--mut);font-size:12px;margin:12px 0 0}
.rgrid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.rbox,.rform,.loc{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:22px}
.empty{color:var(--mut);margin:0}
.avg{display:flex;align-items:center;gap:12px;margin-bottom:14px}.avg b{font-size:34px;color:var(--gold)}.avg small{color:var(--mut)}
.stars{color:var(--gold);letter-spacing:2px}
.rv{margin:0 0 14px;padding-bottom:14px;border-bottom:1px solid #1d1a10}
.rv blockquote{margin:6px 0;color:var(--txt)}.rv figcaption{color:var(--mut);font-size:13px}
.srow{display:flex;gap:4px;margin:6px 0 14px}
.st{background:none;border:0;font-size:32px;line-height:1;color:#5a4a1c;cursor:pointer;padding:2px}
.st.on{color:var(--gold)}
.rform h3,.loc h3{font-size:22px;color:var(--gold);margin-bottom:12px}
.err2{color:#ff8b7a;font-size:13px;margin:0 0 10px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.addr{font-size:18px;margin:0 0 14px;color:var(--gold2)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:12px}
.fb{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.5)}
.fb svg{width:28px;height:28px}
.fb.wa{background:#25d366}.fb.wa svg{fill:#fff}
.fb.call{background:linear-gradient(135deg,var(--gold2),var(--gold3))}.fb.call svg{fill:#1a1204}
.fb.gps{background:#111;border:1px solid var(--gold3)}.fb.gps svg{fill:var(--gold)}
.fb.wa::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:pl 2s infinite}
@keyframes pl{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@media(prefers-reduced-motion:reduce){.fb.wa::after{animation:none;display:none}}
.stp{color:var(--mut);font-size:12px;margin:10px 24px 0}
.cnt{display:block;text-align:end;font-size:12px;color:var(--mut);margin-top:4px}
.f .ph{display:flex;gap:8px;margin-top:6px}
.f .ph select{width:112px;flex:none;margin:0}.f .ph input{margin:0}
.f.chk{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;color:var(--txt)}
.f.chk input{width:auto;margin:4px 0 0;accent-color:var(--gold)}
.f.chk .err{flex-basis:100%}
.f .row2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.f .row2{grid-template-columns:1fr}}
#sum{margin:0 0 14px;display:grid}
#sum div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #1d1a10;font-size:14px}
#sum dt{color:var(--mut)}#sum dd{margin:0;text-align:end;max-width:62%;overflow-wrap:anywhere}
.rvh{margin:0 0 6px;font:600 20px 'Playfair Display',serif;color:var(--gold2)}
[hidden]{display:none!important}
#mp li{align-items:center}#mp li i{transform:none}
.nm{min-width:0}
.qty{display:inline-flex;align-items:center;gap:6px;margin-inline-start:8px}
.qb{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold3);background:none;color:var(--gold);font-size:18px;line-height:1;cursor:pointer;padding:0}
.qb:hover{background:var(--gold);color:#111}
.qty output{min-width:18px;text-align:center;color:var(--gold2)}
.bd{margin-inline-start:6px;background:var(--gold);color:#111;border-radius:99px;padding:0 7px;font-size:12px}
.tabs button[aria-selected=true] .bd{background:#111;color:var(--gold)}
.cart{position:sticky;bottom:14px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;padding-inline-end:84px;border:1px solid var(--gold3);border-radius:16px;background:rgba(17,16,8,.96);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5}
#ol{list-style:none;margin:0 0 6px;padding:0}
#ol li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1d1a10;font-size:14px}
#ol li .nm{flex:1}#ol li.empty{color:var(--mut)}
.tot{font:700 20px 'Playfair Display',serif;color:var(--gold);text-align:end;margin:10px 0 16px}
#of{padding:20px 24px 26px}
.bsv{border:1px solid var(--line);border-radius:16px;background:#0c0b07;margin-bottom:14px;overflow:hidden}
.bsv svg{display:block;width:100%;height:auto}
.bsb{padding:18px 24px 26px}
.est{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 4px;color:var(--mut);font-size:14px}
.est b{color:var(--gold);font-size:22px}
.crow{display:flex;gap:10px;margin:0 0 14px}
.crow input{width:48px;height:38px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
body{overflow-x:clip}
img,svg{max-width:100%}
.burger{display:none;width:42px;height:42px;border:1px solid var(--gold3);border-radius:10px;background:none;cursor:pointer;flex-direction:column;gap:5px;align-items:center;justify-content:center;padding:0}
.burger i{width:20px;height:2px;background:var(--gold);display:block;transition:transform .2s,opacity .2s}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded=true] i:nth-child(2){opacity:0}
.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:1060px){.burger{display:flex}
nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:rgba(5,5,5,.98);border-bottom:1px solid var(--line);padding:6px 20px 16px;max-height:calc(100vh - 72px);overflow:auto}
nav.open{display:flex}
nav a{padding:14px 4px;border-bottom:1px solid #1d1a10;font-size:16px;color:var(--txt)}}
@media(max-width:430px){.lang button{padding:6px 8px}.logo{font-size:19px}.bar{padding:10px 14px;gap:8px}.wrap{padding:0 16px}section{padding:52px 0}}
@media(min-width:1100px){.wrap,.bar{max-width:1200px}#services .grid{grid-template-columns:repeat(3,1fr)}.hero{padding:120px 0 100px}}
@media(min-width:1500px){.wrap,.bar{max-width:1320px}html{font-size:17px}}
.cart{padding-inline-start:84px}
.chatb{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;align-items:center;gap:8px;height:54px;padding:0 18px;border-radius:99px;border:1px solid var(--gold3);background:#111;color:var(--gold);font:600 14px Montserrat,sans-serif;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.5)}
.chatb svg{width:24px;height:24px;fill:var(--gold)}
.chat{position:fixed;left:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;width:min(390px,calc(100vw - 36px));height:min(560px,calc(100dvh - 120px));display:flex;flex-direction:column;border:1px solid var(--gold3);border-radius:18px;background:#0c0b07;box-shadow:0 20px 60px rgba(0,0,0,.7);overflow:hidden}
.chat[hidden]{display:none}
.chh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chh b{flex:1;font-size:16px;color:var(--gold2)}
#chl{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.b{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.u{align-self:flex-end;background:var(--gold);color:#111}
.msg .wal{display:inline-block;margin-top:8px;white-space:normal}
.qr{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 10px}
.qr button{background:none;border:1px solid var(--gold3);color:var(--gold);border-radius:99px;padding:7px 12px;font:500 13px Montserrat,sans-serif;cursor:pointer}
#chf{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
#chf input{flex:1;min-width:0;background:#050505;border:1px solid var(--line);border-radius:99px;color:var(--txt);padding:11px 16px;font:15px Montserrat,sans-serif}
#chf input:focus{border-color:var(--gold);outline:0}
.chn{margin:0;padding:0 14px 10px;color:var(--mut);font-size:11px}
@media(max-width:520px){.chat{left:0;right:0;bottom:0;width:100%;height:82dvh;border-radius:18px 18px 0 0}.chatb span{display:none}.chatb{padding:0;width:54px;justify-content:center}}
.hero{padding:90px 0 70px;background:radial-gradient(ellipse at 80% 0,rgba(233,185,73,.18),transparent 55%)}
.hero{position:relative;overflow:hidden;min-height:min(86vh,760px);display:flex;align-items:center}.hero>.wrap{width:100%}.hero .hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:1}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,5,.86) 0%,rgba(5,5,5,.5) 45%,rgba(5,5,5,0) 78%)}html[dir=rtl] .hero::after{background:linear-gradient(270deg,rgba(5,5,5,.86) 0%,rgba(5,5,5,.5) 45%,rgba(5,5,5,0) 78%)}.hero .wrap{position:relative;z-index:1}.hero h1{background:none;-webkit-text-fill-color:currentColor;color:#ffe39a;text-shadow:0 2px 20px rgba(0,0,0,.75)}.hero p{color:var(--txt);text-shadow:0 1px 12px rgba(0,0,0,.8)}@media(max-width:700px){.hero{min-height:78vh;align-items:flex-end}.hero::after,html[dir=rtl] .hero::after{background:linear-gradient(180deg,rgba(5,5,5,0) 15%,rgba(5,5,5,.88) 100%)}}
.shot:has(img)::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.7));pointer-events:none}.shot b{z-index:1}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero h1{font-size:clamp(38px,7vw,76px);max-width:14ch}
.hero p{max-width:52ch;color:var(--mut);font-size:18px;margin:22px 0 32px}
.hero .row{display:flex;gap:14px;flex-wrap:wrap}
section{padding:70px 0}
h2{font-size:clamp(28px,4.5vw,44px);margin-bottom:34px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.svc{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:24px}
.svc h3{font-size:20px;color:var(--gold);margin-bottom:6px}
.svc p{margin:0;color:var(--mut);font-size:14px}
.work{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.shot{position:relative;height:150px;display:flex;align-items:center;justify-content:center;font:800 28px 'Playfair Display',serif;color:#fff;text-align:center;padding:10px}
.work div+div{padding:18px}
.shot svg{position:absolute;inset:0;width:100%;height:100%}.shot b{position:relative;text-shadow:0 2px 12px #000}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shot:has(img)::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.7));pointer-events:none}.shot b{z-index:1}
.work h3{font-size:19px;color:var(--gold2)}
.work p{margin:6px 0 0;color:var(--mut);font-size:14px}
.offer{text-align:center;border:1px solid var(--gold3);border-radius:22px;padding:50px 20px;background:radial-gradient(circle at 50% 0,rgba(233,185,73,.16),transparent 65%),var(--panel)}
.price{font:800 clamp(64px,14vw,130px)/1 'Playfair Display',serif}
.offer p{color:var(--mut);max-width:50ch;margin:12px auto 26px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:14px;text-align:center}
dialog{border:1px solid var(--gold3);border-radius:20px;background:#0c0b07;color:var(--txt);width:min(620px,94vw);padding:0;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.78)}
.fh{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 8px}
.fh h3{font-size:24px}
.x{background:none;border:0;color:var(--mut);font-size:28px;cursor:pointer}
.prog{height:4px;background:var(--line);margin:8px 24px 0;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:33%;background:var(--gold);transition:width .3s}
form{padding:20px 24px 26px}
.step{display:none}.step.on{display:block}
.step>p{margin:0 0 14px;color:var(--mut);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0}
.chips span{display:block;border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:14px}
.chips input:checked+span{background:var(--gold);color:#111;border-color:var(--gold);font-weight:600}
.chips input:focus-visible+span{outline:2px solid var(--gold2)}
.f{display:block;margin-bottom:14px;font-size:13px;color:var(--mut)}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:6px;background:#050505;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px;font:15px Montserrat,sans-serif}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold);outline:0}
.f .err{color:#ff8b7a;font-size:12px;display:none;margin-top:4px}
.f.bad .err{display:block}.f.bad input{border-color:#ff8b7a}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.ok{text-align:center;padding:40px 24px;display:none}
.ok h3{font-size:26px;margin-bottom:10px}
@media(max-width:760px){.hero{padding:60px 0 40px}.bar .btn.sm{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.prog i{transition:none}}
</style>
</head>
<body>

<!-- ===== CABECERA: logo, menú, idiomas ===== -->
<header><div class="bar">
<div class="logo gold">HERIO <span style="font-size:13px;letter-spacing:2px">360</span></div>
<nav id="nv"><a href="#services" data-i18n="n1"></a><a href="#portfolio" data-i18n="n2"></a><a href="#carta" data-i18n="n4"></a><a href="#horarios" data-i18n="n5"></a><a href="#resenas" data-i18n="n6"></a><a href="#ubicacion" data-i18n="n7"></a><a href="#offre" data-i18n="n3"></a><a href="#contacto" data-i18n="n8"></a></nav>
<div style="display:flex;gap:10px;align-items:center">
<div class="lang" role="group" aria-label="Langue"><button data-l="ar">AR</button><button data-l="fr">FR</button><button data-l="es">ES</button><button data-l="en">EN</button></div>
<button class="btn sm open" data-i18n="cta"></button>
<button type="button" class="burger" id="bg" aria-expanded="false" aria-controls="nv"><i></i><i></i><i></i></button>
</div></div></header>


<!-- ===== CONTENIDO PRINCIPAL ===== -->
<main>
<!-- INICIO (foto + título) -->
<div class="hero"><img class="hbg" src="https://i.imgur.com/hrqr6WX.jpeg" alt="" onerror="this.remove()"><div class="wrap">
<h1 class="gold" data-i18n="h1"></h1>
<p data-i18n="sub"></p>
<div class="row"><button class="btn open" data-i18n="cta"></button><a class="btn ghost" href="#portfolio" data-i18n="seework"></a><button type="button" class="btn ghost" id="bso" data-i18n="bsBtn"></button></div>
</div></div>


<!-- ===== SERVICIOS ===== -->
<section id="services"><div class="wrap">
<h2 data-i18n="n1"></h2>
<div class="grid">
<div class="svc"><h3 data-i18n="s1"></h3><p data-i18n="s1d"></p></div>
<div class="svc"><h3 data-i18n="s2"></h3><p data-i18n="s2d"></p></div>
<div class="svc"><h3 data-i18n="s3"></h3><p data-i18n="s3d"></p></div>
<div class="svc"><h3 data-i18n="s4"></h3><p data-i18n="s4d"></p></div>
<div class="svc"><h3 data-i18n="s5"></h3><p data-i18n="s5d"></p></div>
<div class="svc"><h3 data-i18n="s6"></h3><p data-i18n="s6d"></p></div>
</div></div></section>


<!-- ===== PORTAFOLIO ===== -->
<section id="portfolio"><div class="wrap">

document.addEventListener("click",e=>{if(nv.classList.contains("open")&&!e.target.closest("header"))navOpen(false)});
matchMedia("(min-width:1061px)").addEventListener("change",()=>navOpen(false));
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b){tab=+b.dataset.i;renderMenu()}};
$("#lm").onchange=gps;
$("#lcp").onclick=()=>{const b=$("#lcp"),ok=()=>{b.textContent=T[L].lCopied;setTimeout(()=>b.textContent=T[L].lCopy,1800)};
if(navigator.clipboard)navigator.clipboard.writeText(CFG.addr).then(ok,()=>{});else ok()};
let rating=0;
$$(".st").forEach(b=>b.onclick=()=>{rating=+b.dataset.v;$$(".st").forEach(x=>{x.classList.toggle("on",+x.dataset.v<=rating);x.setAttribute("aria-pressed",+x.dataset.v===rating)})});
$("#rsend").onclick=()=>{const n=$("#rn").value.trim();if(!rating||n.length<2){$("#rerr").hidden=false;return}$("#rerr").hidden=true;
const txt=[T[L].rWa+" "+stars(rating),n,$("#rt").value.trim()].filter(Boolean).join("\n");
window.open("https://wa.me/"+CFG.phone+"?text="+encodeURIComponent(txt),"_blank","noopener")};
setLang("ar");
</script>
